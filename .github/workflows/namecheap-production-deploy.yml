name: Deploy Team Goodwin Production

on:
  push:
    branches:
      - main

jobs:
  production-deploy:
    name: Deploy to Namecheap production
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static site
        run: node build-offline.mjs

      - name: Verify dist output
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/live-tracking.html
          test -d dist/assets
          test -d dist/faq
          test -d dist/updates
          test -d dist/privacy
          test -d dist/terms
          test -d dist/participation-terms
          test -d dist/accessibility

      - name: Deploy dist to Namecheap production
        id: ftp_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-production.json

      - name: Wait before FTP retry 2
        if: ${{ steps.ftp_attempt_1.outcome == 'failure' }}
        run: sleep 25

      - name: Retry production FTP deployment
        id: ftp_attempt_2
        if: ${{ steps.ftp_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-production.json

      - name: Wait before FTP retry 3
        if: ${{ steps.ftp_attempt_1.outcome == 'failure' && steps.ftp_attempt_2.outcome == 'failure' }}
        run: sleep 25

      - name: Retry production FTP deployment again
        id: ftp_attempt_3
        if: ${{ steps.ftp_attempt_1.outcome == 'failure' && steps.ftp_attempt_2.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-production.json

      - name: Confirm production FTP deployment succeeded
        if: ${{ steps.ftp_attempt_1.outcome == 'failure' && steps.ftp_attempt_2.outcome == 'failure' && steps.ftp_attempt_3.outcome == 'failure' }}
        run: |
          echo "Production FTP deployment failed after 3 attempts."
          exit 1
