name: Namecheap Staging Deployment

on:
  push:
    branches:
      - main

jobs:
  staging-deploy:
    name: Deploy to Namecheap staging
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static site
        run: node build-offline.mjs

      - name: Verify dist output
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/live-tracking.html
          test -d dist/assets
          test -d dist/faq
          test -d dist/updates
          test -d dist/privacy
          test -d dist/terms
          test -d dist/participation-terms
          test -d dist/accessibility

      - name: Deploy dist to Namecheap staging
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/github-staging/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-staging.json

      - name: Verify remote staging contents
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import sys

          required = {
              "index.html",
              "live-tracking.html",
              "assets",
              "faq",
              "updates",
              "privacy",
              "terms",
              "participation-terms",
              "accessibility",
          }

          with ftplib.FTP(os.environ["FTP_SERVER"], timeout=60) as ftp:
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              ftp.cwd("/public_html/github-staging/")
              names = set(ftp.nlst())

          missing = sorted(required - names)
          if missing:
              print("Missing expected staging files/directories:")
              for item in missing:
                  print(f"- {item}")
              sys.exit(1)

          print("Remote staging directory contains expected site files.")
          PY
